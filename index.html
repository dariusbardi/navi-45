<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Navi 45">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="description" content="Navigation für den AM-Führerschein – Routen ohne Autobahn und Kraftfahrstraße, max. 45 km/h">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<title>Navi 45</title>
<style>
/* VOICE: wie Apple Karten – hell, ruhig, große Tippflächen, nichts Überflüssiges
   IDEA: Vektorkarte vollflächig, ein schwebendes Blatt mit drei Höhen, Navi mit gekippter, mitdrehender Karte
   PICTURE: die Karte selbst – blaue Route, blauer Standortpfeil, farbige Filial-Pins
   COLOUR and TYPE: Weiß/Systemgrau, Blau #007aff, Grün #34c759 „Los", Rot „Beenden"; Systemschrift
   LAYOUT: Knöpfe rechts oben, Blatt unten, Abbiegetafel oben im Navi */
:root{--blue:#007aff;--green:#34c759;--red:#ff3b30;--ink:#111;--mut:#6e6e73;--line:rgba(60,60,67,.14);--fill:rgba(118,118,128,.12);--sheet:rgba(255,255,255,.94);--card:#fff;--nav:#1d6b45;--nav2:#145233;--shadow:0 6px 30px rgba(0,0,0,.16)}
@media (prefers-color-scheme:dark){:root{--ink:#f5f5f7;--mut:#98989f;--line:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--sheet:rgba(30,30,32,.94);--card:#2c2c2e}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--ink);background:#e9e6df;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#map{position:fixed;inset:0}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.glass{background:var(--sheet);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
/* Bedienknöpfe */
#ctrl{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;display:flex;flex-direction:column;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
#ctrl button{width:46px;height:46px;display:grid;place-items:center;color:var(--blue)}
#ctrl button+button{border-top:1px solid var(--line)}
#compass{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 160px);z-index:20;width:38px;height:38px;border-radius:50%;box-shadow:var(--shadow);display:none;place-items:center}
#compass.on{display:grid}
#limit{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;height:34px;border-radius:17px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
#limit b{color:var(--blue);font-size:15px}
#roadSign{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 54px);z-index:21;width:66px;height:66px;border-radius:50%;background:#fff;border:7px solid #e30613;display:grid;place-items:center;font:800 26px/1 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#111;box-shadow:0 4px 16px rgba(0,0,0,.3);letter-spacing:-1px}
#roadSign[hidden]{display:none}
body.navi #roadSign{top:auto;bottom:calc(env(safe-area-inset-bottom) + 104px);width:78px;height:78px;font-size:31px;border-width:8px}
.favs{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;text-align:center;line-height:1.15}
.fav i{width:52px;height:52px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:#ff9f0a;font-style:normal}
.fav span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:24px;height:24px;border-radius:50%;background:#ff9f0a;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer}
.star svg{width:13px;height:13px}
.chips2{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.chip2{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:18px;height:36px;padding:0 12px;font-size:14px;font-weight:600}
.chip2 i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.chip2 i svg{width:13px;height:13px}
.maplibregl-ctrl-top-left{top:calc(env(safe-area-inset-top) + 128px)!important}
.maplibregl-ctrl-attrib{font-size:10px}
/* Blatt */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;border-radius:16px 16px 0 0;box-shadow:0 -2px 30px rgba(0,0,0,.18);max-width:620px;margin:0 auto;height:var(--h,260px);display:flex;flex-direction:column;transition:height .32s cubic-bezier(.2,.8,.2,1)}
#sheet.drag{transition:none}
.grabzone{flex:none;padding:7px 0 9px;cursor:grab;touch-action:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(127,127,127,.45);margin:0 auto}
#body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(env(safe-area-inset-bottom) + 16px)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:0 10px;height:42px}
.search input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);outline:none;height:42px}
.search .clr{color:var(--mut);width:28px;height:28px;display:none;place-items:center}
.search.has .clr{display:grid}
.cats{display:flex;gap:16px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;font-size:12px;font-weight:500;color:var(--ink);text-align:center;line-height:1.15}
.cat i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
h2{font-size:24px;line-height:1.15;margin:2px 0 2px;font-weight:700}
.sub{color:var(--mut);font-size:15px}
.sec{font-size:15px;color:var(--ink);font-weight:700;margin:18px 0 6px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;position:relative}
.list li+li::before{content:"";position:absolute;left:58px;right:0;top:0;border-top:1px solid var(--line)}
.list li:active{background:var(--fill)}
.ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--blue);font-weight:800;font-size:13px}
.tx{flex:1}.tx b{font-weight:600}.tx small{display:block;color:var(--mut);font-size:14px;margin-top:1px}
.rt{white-space:nowrap;color:var(--mut);font-size:14px;text-align:right}
.rt b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.tag{display:inline-block;background:rgba(52,199,89,.16);color:#1f8a3b;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-left:4px;vertical-align:1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:13px;font-weight:600;font-size:17px;color:#fff;background:var(--blue)}
.btn.go{background:var(--green)}.btn.soft{background:var(--fill);color:var(--blue)}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}
.head{display:flex;align-items:flex-start;gap:10px}.head>div{flex:1}
.x{flex:none;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--mut);display:grid;place-items:center;font-size:15px;font-weight:700}
.time{font-size:28px;font-weight:700;line-height:1.1}
.from{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-top:12px;font-size:15px}
.from .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--blue);flex:none}
.from input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.from button{color:var(--blue);font-weight:600;font-size:15px}
.alts{display:flex;gap:10px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.alt{flex:none;min-width:132px;text-align:left;background:var(--card);border-radius:12px;padding:10px 12px;border:2px solid transparent}
.alt.on{border-color:var(--blue)}
.alt b{display:block;font-size:20px}.alt span{font-size:13px;color:var(--mut)}
.note{background:rgba(255,204,0,.18);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.note.err{background:rgba(255,59,48,.14)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--blue);animation:sp 0.8s linear infinite;display:inline-block;vertical-align:-5px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.set{display:flex;align-items:center;gap:12px;padding:12px;justify-content:space-between}
.set+.set{border-top:1px solid var(--line)}
.set select{font:inherit;font-size:15px;color:var(--blue);background:none;border:0;max-width:60%;text-align:right}
.set input[type=range]{width:45%}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:16px;background:rgba(120,120,128,.32);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--green)}.sw input:checked+span::after{transform:translateX(20px)}
/* Navigation */
#nav{display:none;position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:30;max-width:620px;margin:0 auto}
.sign{background:var(--nav);color:#fff;border-radius:16px 16px 16px 16px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.sign svg{flex:none;width:56px;height:56px}
#nDist{font-size:clamp(30px,9vw,40px);font-weight:700;line-height:1}
#nText{font-size:20px;line-height:1.2;margin-top:4px;font-weight:600}
#nThen{display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin-top:-6px;padding:12px 14px 8px;background:var(--nav2);color:#fff;border-radius:0 0 14px 14px;font-size:15px;font-weight:600}
#nThen svg{width:22px;height:22px;flex:none}
#navBar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:16px 16px 0 0;box-shadow:0 -2px 30px rgba(0,0,0,.18);padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);max-width:620px;margin:0 auto}
.nb{display:flex;align-items:center;gap:10px}
.nb .st{flex:1;text-align:center}.nb .st b{display:block;font-size:22px;font-weight:700}.nb .st span{font-size:13px;color:var(--mut)}
.spd{flex:none;width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:21px;line-height:1;text-align:center;box-shadow:inset 0 0 0 2px var(--line)}
.spd small{display:block;font-size:10px;font-weight:600;color:var(--mut)}
.spd.over{box-shadow:inset 0 0 0 4px var(--red);color:var(--red)}
.end{flex:none;background:var(--red);color:#fff;border-radius:22px;height:44px;padding:0 18px;font-weight:700}
#recenter{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 108px);z-index:30;border-radius:22px;height:44px;padding:0 18px;font-weight:700;color:var(--blue);box-shadow:var(--shadow)}
#navMute{display:none;position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 108px);z-index:30;width:46px;height:46px;border-radius:50%;color:var(--blue);box-shadow:var(--shadow);place-items:center}
body.navi #sheet,body.navi #ctrl,body.navi #limit,body.navi #compass,body.navi .maplibregl-ctrl-top-left{display:none}
body.navi #nav,body.navi #navBar{display:block}
body.navi #navMute{display:grid}
body.navi.free #recenter{display:block}
/* Marker */
.puck{width:26px;height:26px;position:relative}
.puck .d{position:absolute;inset:3px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.puck .arr{position:absolute;left:50%;top:-14px;margin-left:-9px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid rgba(0,122,255,.55);display:none}
.puck.dir .arr{display:block}
.puck.nav{width:44px;height:44px}
.puck.nav .d{inset:0;border:0;background:none;box-shadow:none}
.puck.nav .d svg{width:44px;height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:grid;place-items:center;cursor:pointer}
.pin span{transform:rotate(45deg);font-weight:800;font-size:12px;display:grid;place-items:center}
.pin.sm{width:26px;height:26px}.pin.sm span{font-size:10px}
.pin svg{width:15px;height:15px}
.dotm{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.3)}
#warn{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:40;max-width:600px;margin:0 auto;background:#d70015;color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:700;font-size:17px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#warn[hidden]{display:none}
#warn svg{flex:none;width:34px;height:34px}
#warn small{display:block;font-weight:500;font-size:14px;opacity:.9}
body.car #limit{display:none}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="limit" class="glass" aria-label="Ihr Fahrzeug fährt höchstens 45 km/h">Ihr Max <b>45</b></div>
<div id="roadSign" hidden aria-label="Erlaubte Geschwindigkeit auf dieser Straße"></div>
<div id="ctrl" class="glass">
  <button id="btnLoc" aria-label="Meinen Standort zeigen"><svg id="locIc" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 3 3 10.5l7.5 3 3 7.5z"/></svg></button>
  <button id="btn3d" aria-label="2D oder Vogelperspektive" style="font-weight:700;font-size:15px">3D</button>
  <button id="btnType" aria-label="Kartentyp: Standard oder Satellit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg></button>
  <button id="btnSet" aria-label="Einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>
<button id="compass" class="glass" aria-label="Karte nach Norden ausrichten"><svg id="compIc" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l4 10h-8z" fill="#ff3b30"/><path d="M12 22l-4-10h8z" fill="#8e8e93"/></svg></button>

<div id="warn" hidden role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.5" stroke-linecap="round"/></svg><div>Verbotene Straße!<small id="warnTxt">Autobahn oder Kraftfahrstraße – mit dem AM-Führerschein nicht erlaubt. Bitte bei der nächsten Möglichkeit abfahren.</small></div></div>
<div id="sheet" class="glass"><div class="grabzone" id="grab"><div class="grab"></div></div><div id="body"></div></div>

<div id="nav"><div class="sign"><svg id="nIcon" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></svg><div><div id="nDist">–</div><div id="nText">Route wird gestartet …</div></div></div><div id="nThen" hidden></div></div>
<button id="recenter" class="glass">Zentrieren</button>
<button id="navMute" class="glass" aria-label="Ansagen an oder aus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mx" d="M17 9l5 6M22 9l-5 6" style="display:none"/></svg></button>
<div id="navBar" class="glass"><div class="nb">
  <div class="spd" id="nSpd">–<small>km/h</small></div>
  <div class="st"><b id="nEta">–</b><span>Ankunft</span></div>
  <div class="st"><b id="nMin">–</b><span>Min.</span></div>
  <div class="st"><b id="nKm">–</b><span>km</span></div>
  <button class="end" id="btnStop">Beenden</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>
{
const VALHALLA='https://valhalla1.openstreetmap.de',PHOTON='https://photon.komoot.io',OVERPASS='https://overpass-api.de/api/interpreter';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem('navi45.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('navi45.'+k,JSON.stringify(v))}catch(e){}}};
const CFG=Object.assign({voice:'',rate:1,quiet:false,noUnpaved:true,theme:'auto',mapType:'std',hint:true,vehicle:'am',showForbidden:true,warnForbidden:true},LS.get('cfg',{}));
const isAM=()=>CFG.vehicle!=='car';
const COST=()=>isAM()?'motor_scooter':'auto';
const vehTxt=()=>isAM()?'mit 45 km/h':'mit dem Auto';
document.body.classList.toggle('car',!isAM());
const S={me:null,acc:0,heading:null,kmh:null,watch:null,follow:0,from:null,dest:null,routes:[],sel:0,navi:false,sim:null,lastIdx:0,off:0,rerouting:false,said:{},mute:false,wake:null,recent:LS.get('recent',[]),favs:LS.get('favs',[]),favMarkers:[],trail:[],pending:null,markers:[],bip:null,clickGuard:0,camBusy:false};
const route=()=>S.routes[S.sel];

// ---------- Hilfen ----------
const R=6371000,rad=x=>x*Math.PI/180,deg=x=>x*180/Math.PI;
function hav(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function brg(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(deg(Math.atan2(y,x))+360)%360}
function decode6(s){let i=0,la=0,lo=0,o=[];while(i<s.length){for(const k of [0,1]){let b,sh=0,r=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=(r&1)?~(r>>1):(r>>1);if(k===0)la+=d;else lo+=d}o.push([la/1e6,lo/1e6])}return o}
const comma=n=>String(n).replace('.',',');
const fmtDist=m=>m>=1000?comma((m/1000).toFixed(m>=10000?0:1))+' km':(m>=100?Math.round(m/50)*50:Math.max(10,Math.round(m/10)*10))+' m';
const spokenDist=m=>m>=1000?(m<1500?'einem Kilometer':comma((Math.round(m/500)/2).toString())+' Kilometern'):Math.round(m/50)*50+' Metern';
const mins=s=>Math.max(1,Math.round(s/60));
const fmtTime=s=>{const m=mins(s);return m<60?m+' Min.':Math.floor(m/60)+' Std. '+(m%60)+' Min.'};
const clock=s=>new Date(Date.now()+s*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

{let y0=0,h0=0,drag=false;const g=$('grab'),sh=$('sheet');

async function search(q){
  const res=$('res');if(!res)return;if(q.length<2){res.innerHTML='';return}
  const c=origin();
  try{const j=await (await fetch(`${PHOTON}/api/?q=${encodeURIComponent(q)}&lang=de&limit=10&lat=${c.lat}&lon=${c.lon}&location_bias_scale=0.3`,{signal:withTimeout(10000)})).json();
    if(!$('res')||$('q')?.value.trim()!==q)return;
    const items=j.features.map(f=>{const l=label(f);const lat=f.geometry.coordinates[1],lon=f.geometry.coordinates[0];const pk=f.properties.osm_key;return{name:l.main,sub:l.sub,lat,lon,d:hav([c.lat,c.lon],[lat,lon]),shop:pk==='shop'||pk==='amenity'}});
    res.innerHTML=items.length?`<div class="group" style="margin-top:14px"><ul class="list">${items.map((r,i)=>`<li data-i="${i}"><span class="ic"${r.shop?' style="background:#ff9500;color:#fff"':''}>${r.shop?IC.bag.replace('<svg','<svg width="17" height="17"'):''}<svg${r.shop?' hidden':''} width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></span><span class="tx"><b>${esc(r.name)}</b><small>${esc(r.sub)}</small></span><span class="rt">${fmtDist(r.d)}</span></li>`).join('')}</ul></div>`:'<div class="sub" style="margin-top:14px">Nichts gefunden.</div>';
    res.querySelectorAll('[data-i]').forEach(li=>li.onclick=()=>{document.activeElement?.blur();place(items[+li.dataset.i])});
  }catch(e){if($('res'))res.innerHTML='<div class="note err">Suche gerade nicht erreichbar.</div>'}
}

  $('x').onclick=()=>{clearMarkers();home()};
  clearMarkers();setDestMarker(null);clearRoute();
  const dLat=0.25,dLon=0.36,bbox=[c.lon-dLon,c.lat-dLat,c.lon+dLon,c.lat+dLat].map(n=>n.toFixed(4)).join(',');
  const seen=new Set();let list=[];

  // Fahrzeiten mit 45 km/h für alle auf einmal

    const j=await (await fetch(`${VALHALLA}/sources_to_targets?json=${encodeURIComponent(JSON.stringify(q))}`,{signal:withTimeout(15000)})).json();

    const j=await (await fetch(OVERPASS+'?data='+encodeURIComponent(q),{signal:withTimeout(9000)})).json();const m={};j.elements.forEach(e=>m[e.type[0].toUpperCase()+e.id]=e.tags.drive_through);list.forEach(x=>x.dt=m[x.id]);S.dtOk=true}catch(e){S.dtOk=false}}
  if(!$('x'))return;
  list.sort((a,b)=>(a.sec??a.air/9)-(b.sec??b.air/9));
  list.forEach((x,i)=>{const el=pinEl(cat,i>4);S.markers.push(addMarker(el,x.lat,x.lon,()=>place(x)))});
  const bounds=new maplibregl.LngLatBounds();list.slice(0,8).forEach(x=>bounds.extend([x.lon,x.lat]));bounds.extend([c.lon,c.lat]);
  fitTo(bounds,H.half(),15);
  const dtLine=x=>cat.dt?(x.dt==='yes'?'<span class="tag">Drive-in</span>':''):'';
  body(`<div class="head"><div><h2>${esc(cat.label)}</h2><div class="sub">${list.length} Treffer ${near} · sortiert nach Fahrzeit ${vehTxt()}</div></div><button class="x" id="x" aria-label="Schließen">✕</button></div>

  <div class="group" style="margin-top:12px"><ul class="list">${list.map((x,i)=>`<li data-i="${i}">${catIcon(cat,'ic')}<span class="tx"><b>${esc(x.name)}</b>${dtLine(x)}<small>${esc(x.sub||'')}</small></span><span class="rt">${x.sec!=null?`<b>${fmtTime(x.sec)}</b>${comma(x.km.toFixed(1))} km`:fmtDist(x.air)}</span></li>`).join('')}</ul></div>`);
  $('x').onclick=()=>{clearMarkers();home()};

let mMe=null,meEl=null;
function startWatch(){

  {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
}
$('btnLoc').onclick=()=>{

// Warnung, wenn man auf eine verbotene Straße fährt (nur AM)
function angDiff(a,b){return Math.abs(((b-a+540)%360)-180)}
function checkForbidden(lat,lon,hd){
  if(!isAM()||!CFG.warnForbidden||!map.getLayer('forbidden')||hd==null||!((S.kmh??0)>8)){S.fbHits=0;return}
  let hit=false;try{const pt=map.project([lon,lat]);const fs=map.queryRenderedFeatures([[pt.x-10,pt.y-10],[pt.x+10,pt.y+10]],{layers:['forbidden']});
    for(const f of fs){const g=f.geometry,lines=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];
      for(const c of lines)for(let i=0;i<c.length-1;i++){const a=[c[i][1],c[i][0]],b=[c[i+1][1],c[i+1][0]];if(hav(a,[lat,lon])+hav(b,[lat,lon])>hav(a,b)+40)continue;const lb=brg(a,b);if(Math.min(angDiff(lb,hd),angDiff((lb+180)%360,hd))<30)hit=true}}}catch(e){}
  S.fbHits=hit?(S.fbHits||0)+1:Math.max(0,(S.fbHits||0)-1);
  if(S.fbHits>=3&&$('warn').hidden){$('warn').hidden=false;say('Achtung! Diese Straße ist mit dem AM-Führerschein verboten. Bitte bei der nächsten Möglichkeit abfahren.',true);try{navigator.vibrate?.([300,150,300])}catch(e){}}
  if(S.fbHits===0&&!$('warn').hidden)$('warn').hidden=true;
}
$('warn').onclick=()=>{$('warn').hidden=true};
// weiche Drehung der Karte
function smoothBearing(target){if(S.camB==null)S.camB=target;const d=((target-S.camB+540)%360)-180;S.camB=(S.camB+d*(Math.abs(d)>60?0.85:0.55)+360)%360;return S.camB}

// ---------- Route ----------
const mopedOpts=(up=CFG.noUnpaved)=>isAM()?({top_speed:45,use_primary:CFG.quiet?0.1:0.45,use_hills:0.5,exclude_unpaved:up}):({use_highways:CFG.quiet?0.3:1,exclude_unpaved:up});
const costOpts=up=>({[COST()]:mopedOpts(up)});
async function getRoutes(a,b,alts=2){
  const ask=async up=>{const q={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing:COST(),costing_options:costOpts(up),directions_options:{units:'kilometers',language:'de-DE'},alternates:alts};
    return (await fetch(`${VALHALLA}/route?json=${encodeURIComponent(JSON.stringify(q))}`,{signal:withTimeout(20000)})).json()};
  let j=await ask(CFG.noUnpaved),fallback=false;
  if(!j.trip&&CFG.noUnpaved){j=await ask(false);fallback=true}
  if(!j.trip)throw new Error(j.error||'Keine Route gefunden');
  return[j,...(j.alternates||[])].map(x=>{const leg=x.trip.legs[0],coords=decode6(leg.shape),cum=[0];
    for(let i=1;i<coords.length;i++)cum[i]=cum[i-1]+hav(coords[i-1],coords[i]);
    return{coords,cum,shape:leg.shape,man:leg.maneuvers,km:x.trip.summary.length,sec:x.trip.summary.time,fallback}});
}
// Tempolimits und Straßenbelag je Abschnitt (aus OpenStreetMap über Valhalla)
const ATTRS=['edge.speed_limit','edge.unpaved','edge.surface','edge.length','edge.begin_shape_index','edge.end_shape_index'];
async function loadAttrs(r){
  if(!r||r.edges||r.attrBusy)return;r.attrBusy=true;
  try{const q={encoded_polyline:r.shape,shape_match:'edge_walk',costing:COST(),filters:{attributes:ATTRS,action:'include'}};
    const j=await (await fetch(`${VALHALLA}/trace_attributes`,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(q),signal:withTimeout(20000)})).json();
    r.edges=(j.edges||[]).map(e=>({b:e.begin_shape_index,e:e.end_shape_index,sl:+e.speed_limit||0,up:!!e.unpaved,len:(e.length||0)*1000}));
    r.unpavedM=r.edges.filter(e=>e.up).reduce((a,e)=>a+e.len,0);
    const sl=r.edges.map(e=>e.sl).filter(v=>v>0&&v<200);r.slMin=sl.length?Math.min(...sl):0;r.slMax=sl.length?Math.max(...sl):0;
  }catch(e){}r.attrBusy=false;
  if(r===route()&&$('upNote'))fillRouteNote();
}
function limitAt(r,idx){if(!r?.edges)return 0;let k=r._ek||0;const E=r.edges;if(!E[k]||E[k].b>idx)k=0;while(k<E.length-1&&E[k].e<=idx)k++;r._ek=k;return E[k]&&E[k].b<=idx?E[k].sl:0}
function showSign(v){const el=$('roadSign');if(v>0&&v<200){el.hidden=false;el.textContent=v}else el.hidden=true}
function fillRouteNote(){const r=route(),n=$('upNote');if(!n||!r)return;const parts=[];
  if(r.slMax)parts.push(`Tempolimits auf der Strecke: ${r.slMin===r.slMax?r.slMin:r.slMin+'–'+r.slMax} km/h`);
  if(r.fallback)parts.push('<b>Ohne Schotterwege gibt es hier keine Route</b> – diese Route nutzt unbefestigte Wege.');
  else if(r.unpavedM>30)parts.push(`Enthält etwa ${fmtDist(r.unpavedM)} unbefestigte Wege.`);
  n.innerHTML=parts.length?`<div class="note${r.fallback||r.unpavedM>30?'':''}" style="${r.fallback||r.unpavedM>30?'':'background:var(--card)'}">${parts.join('<br>')}</div>`:''}
// Tempolimit auch ohne Navigation: letzte Positionen auf die Straße legen
async function freeLimit(){
  if(S.navi||S.trail.length<2||!((S.kmh??0)>4))return;
  try{const q={shape:S.trail.slice(-5).map(p=>({lat:p[0],lon:p[1]})),shape_match:'map_snap',costing:COST(),filters:{attributes:['edge.speed_limit'],action:'include'}};
    const j=await (await fetch(`${VALHALLA}/trace_attributes`,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(q),signal:withTimeout(8000)})).json();
    const e=(j.edges||[]).at(-1);if(!S.navi)showSign(e?+e.speed_limit:0)}catch(e){}
}
setInterval(freeLimit,8000);
function clearRoute(){S.routes=[];S.sel=0;setGeo('alt',null);setGeo('route',null);setGeo('done',null);setFromMarker(null)}
function drawRoutes(fit){
  const r=route();if(!r)return;
  const others=S.routes.filter((_,i)=>i!==S.sel).map(x=>x.coords);
  setGeo('alt',others.length?others:null);setGeo('route',r.coords);setGeo('done',null);
  if(fit){const b=new maplibregl.LngLatBounds();S.routes.forEach(x=>x.coords.forEach(p=>b.extend([p[1],p[0]])));fitTo(b,H.half())}
}
map.on('click','alt-line',e=>{if(S.navi||S.routes.length<2)return;S.clickGuard=Date.now();
  const pt=[e.lngLat.lat,e.lngLat.lng];let best=0,bd=1e12;S.routes.forEach((r,i)=>{if(i===S.sel)return;for(let k=0;k<r.coords.length;k+=3){const d=hav(pt,r.coords[k]);if(d<bd){bd=d;best=i}}});S.sel=best;drawRoutes(false);preview()});
async function routeTo(p){
  unlockSpeech();
  S.dest=p;S.recent=[{name:p.name,sub:p.sub||'',lat:p.lat,lon:p.lon,cat:p.cat||null},...S.recent.filter(r=>r.name!==p.name||Math.abs(r.lat-p.lat)>1e-4)].slice(0,6);LS.set('recent',S.recent);
  if(!S.from&&!S.me){S.pending=p;fromUI(p,false);startWatch();return}
  S.pending=null;clearMarkers();
  const from=S.from||{...S.me,name:'Mein Standort'};
  body(`<h2><span class="spin"></span>Route wird berechnet …</h2><div class="sub">${isAM()?'Nur Straßen, die mit 45 km/h erlaubt sind.':'Mit dem Auto.'}</div>`,'peek');
  try{S.routes=await getRoutes(from,p);S.sel=0;setFromMarker(S.from);drawRoutes(true);preview()}
  catch(e){body(`<div class="head"><div><h2>Keine Route</h2></div><button class="x" id="x">✕</button></div><div class="note err">Keine erlaubte Strecke gefunden oder der Routendienst ist gerade nicht erreichbar. Bitte gleich nochmal versuchen.</div><div class="row"><button class="btn soft" id="again">Nochmal versuchen</button></div>`,'peek');$('x').onclick=()=>place(p,true);$('again').onclick=()=>routeTo(p)}
}
function fromUI(p,denied){
  body(`<div class="head"><div><h2>${denied?'Standort nicht erlaubt':'<span class="spin"></span>Standort wird gesucht …'}</h2><div class="sub">${denied?'Erlauben Sie den Standort in den Einstellungen – oder tippen Sie den Start ein:':'Bitte „Erlauben“ tippen – oder den Start eintippen:'}</div></div><button class="x" id="x" aria-label="Schließen">✕</button></div>
  <div class="from"><span class="dot"></span><input id="fq" placeholder="Startadresse eintippen" autocomplete="off"></div><div id="fr"></div>`,'half');
  $('x').onclick=()=>{S.pending=null;place(p,true)};
  const fq=$('fq');let t;fq.onfocus=()=>sheetTo('full');
  fq.oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{try{const c=center();const j=await (await fetch(`${PHOTON}/api/?q=${encodeURIComponent(fq.value)}&lang=de&limit=6&lat=${c.lat}&lon=${c.lon}`)).json();
    const it=j.features.map(f=>{const l=label(f);return{name:l.main,sub:l.sub,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}});
    $('fr').innerHTML=`<div class="group" style="margin-top:12px"><ul class="list">${it.map((r,i)=>`<li data-i="${i}"><span class="ic"><span class="dotm" style="width:14px;height:14px;border-width:3px"></span></span><span class="tx"><b>${esc(r.name)}</b><small>${esc(r.sub)}</small></span></li>`).join('')}</ul></div>`;
    $('fr').querySelectorAll('[data-i]').forEach(li=>li.onclick=()=>{fq.blur();S.from=it[+li.dataset.i];routeTo(p)})}catch(e){}},300)};
  const iv=setInterval(()=>{if(!$('fq')){clearInterval(iv);return}if(S.me&&!S.from){clearInterval(iv);routeTo(p)}},700);
}
function preview(){
  const r=route(),from=S.from||{name:'Mein Standort'},p=S.dest,fastest=Math.min(...S.routes.map(x=>x.sec));
  body(`<div class="head"><div><div class="time">${fmtTime(r.sec)}</div><div class="sub">${comma(r.km.toFixed(1))} km · Ankunft ${clock(r.sec)}${isAM()?' · max. 45 km/h':''}</div></div><button class="x" id="x" aria-label="Schließen">✕</button></div>
  ${S.routes.length>1?`<div class="alts">${S.routes.map((x,i)=>`<button class="alt${i===S.sel?' on':''}" data-a="${i}"><b>${fmtTime(x.sec)}</b><span>${comma(x.km.toFixed(1))} km${x.sec===fastest?' · Schnellste':''}</span></button>`).join('')}</div>`:''}
  <div class="from"><span class="dot"></span><span style="flex:1">Von <b>${esc(from.name)}</b> nach <b>${esc(p.name)}</b></span>${S.from?'<button id="useMe">Mein Standort</button>':''}</div>
  <div id="upNote"></div>
  <div class="row"><button class="btn go" id="go">Los</button><button class="btn soft" id="sim" style="flex:.6">Probefahrt</button></div>
  <div class="sec">Strecke</div>
  <div class="group"><ul class="list">${r.man.map(m=>`<li style="cursor:default"><span class="ic" style="color:var(--ink)">${arrow(m.type,18,'currentColor',6)}</span><span class="tx">${esc(m.instruction)}</span><span class="rt">${m.length?fmtDist(m.length*1000):''}</span></li>`).join('')}</ul></div>`,'half');
  $('x').onclick=()=>{clearRoute();S.from=null;place(p,true)};
  $('go').onclick=()=>startNavi(false);$('sim').onclick=()=>startNavi(true);
  $('body').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.a;drawRoutes(false);preview()});
  if($('useMe'))$('useMe').onclick=()=>{S.from=null;routeTo(p)};
  if(r.edges)fillRouteNote();else loadAttrs(r);
}

// ---------- Pfeile ----------
function arrow(t,size,col='#fff',w=7){
  const a={8:0,7:0,17:0,22:0,25:0,1:0,2:0,3:0,9:45,18:45,20:45,23:25,10:90,11:135,12:180,13:180,14:-135,15:-90,16:-45,19:-45,21:-45,24:-25}[t]??0;
  const inner=[4,5,6].includes(t)?'<path d="M18 58V8M18 10h28l-6 9 6 9H18"/>':[26,27].includes(t)?'<circle cx="32" cy="32" r="11"/><path d="M32 60V43M32 21V6M23 14l9-9 9 9"/>':t===12||t===13?`<path d="M40 58V26a12 12 0 0 0-24 0v18M8 36l8 8 8-8" ${t===12?'transform="matrix(-1 0 0 1 64 0)"':''}/>`:`<g transform="rotate(${a} 32 40)"><path d="M32 60V14M18 28l14-14 14 14"/></g>`;
  return size?`<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`:inner;
}

// ---------- Stimme ----------
let speechOk=false;
function voices(){return('speechSynthesis' in window?speechSynthesis.getVoices():[]).filter(v=>/^de/i.test(v.lang))}
function scoreVoice(v){let s=0;const n=v.name.toLowerCase();if(/premium|enhanced|erweitert|natural|neural|online/.test(n))s+=10;if(/anna|helena|petra|google|katja|vicki|marlene|seraphina|amala/.test(n))s+=3;if(/de-de/i.test(v.lang))s+=2;if(/eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bubbles|whisper|zarvox|bad news|bells|boing|cellos|jester|organ|superstar|trinoids|wobble|good news/.test(n))s-=20;return s}
function bestVoice(){const vs=voices();if(CFG.voice){const v=vs.find(v=>v.name===CFG.voice);if(v)return v}return vs.sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]||null}
function unlockSpeech(){if(speechOk||!('speechSynthesis' in window))return;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);speechOk=true}catch(e){}}
function say(t,force){if((S.mute&&!force)||!('speechSynthesis' in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\bSt (\d)/g,'Staatsstraße $1').replace(/\bB (\d)/g,'Bundesstraße $1').replace(/\/\s*/g,', '));u.lang='de-DE';const v=bestVoice();if(v)u.voice=v;u.rate=CFG.rate;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{if($('vSel'))settings()};
const setMuteUI=()=>{document.querySelectorAll('#navMute .wave').forEach(e=>e.style.display=S.mute?'none':'');document.querySelectorAll('#navMute .mx').forEach(e=>e.style.display=S.mute?'':'none')};
$('navMute').onclick=()=>{S.mute=!S.mute;setMuteUI();if(S.mute)try{speechSynthesis.cancel()}catch(e){}};

// ---------- Einstellungen ----------
function settings(){
  const vs=voices().sort((a,b)=>scoreVoice(b)-scoreVoice(a)),cur=bestVoice();
  body(`<div class="head"><div><h2>Einstellungen</h2></div><button class="x" id="x" aria-label="Schließen">✕</button></div>
  <div class="sec">Fahrzeug</div>
  <div class="group"><div class="set"><span>Ich fahre</span><select id="veh"><option value="am" ${isAM()?'selected':''}>AM-Führerschein (45 km/h)</option><option value="car" ${!isAM()?'selected':''}>Normales Auto</option></select></div>
  ${isAM()?`<div class="set"><span>Verbotene Straßen rot zeigen<br><small class="sub">Autobahn und Kraftfahrstraße</small></span><label class="sw"><input type="checkbox" id="fbShow" ${CFG.showForbidden?'checked':''}><span></span></label></div>
  <div class="set"><span>Warnung beim Auffahren<br><small class="sub">Roter Hinweis, Ansage und Vibration</small></span><label class="sw"><input type="checkbox" id="fbWarn" ${CFG.warnForbidden?'checked':''}><span></span></label></div>`:''}</div>
  <div class="sec">Ansagen</div>
  <div class="group">
    <div class="set"><span>Stimme</span><select id="vSel">${vs.length?vs.map(v=>`<option ${cur&&v.name===cur.name?'selected':''}>${esc(v.name)}</option>`).join(''):'<option>Standard</option>'}</select></div>
    <div class="set"><span>Tempo</span><input type="range" id="rate" min="0.8" max="1.3" step="0.05" value="${CFG.rate}"></div>
    <div class="set"><button id="vTest" style="color:var(--blue);font-weight:600">Stimme testen</button></div>
  </div>
  ${isIOS?'<div class="sub" style="margin-top:8px;font-size:13px">Schönere Stimmen: iPhone-Einstellungen › Bedienungshilfen › Gesprochene Inhalte › Stimmen › Deutsch – dort z. B. „Anna (Premium)“ laden.</div>':''}
  <div class="sec">Route</div>
  <div class="group">
    <div class="set"><span>Schotter- und Feldwege meiden<br><small class="sub">Nur befestigte Straßen, wenn möglich</small></span><label class="sw"><input type="checkbox" id="unp" ${CFG.noUnpaved?'checked':''}><span></span></label></div>
    <div class="set"><span>Ruhige Strecken bevorzugen<br><small class="sub">Weniger Hauptstraßen, etwas länger</small></span><label class="sw"><input type="checkbox" id="quiet" ${CFG.quiet?'checked':''}><span></span></label></div>
  </div>
  <div class="sec">Karte</div>
  <div class="group"><div class="set"><span>Kartentyp</span><select id="mtype"><option value="std" ${CFG.mapType!=='sat'?'selected':''}>Standard</option><option value="sat" ${CFG.mapType==='sat'?'selected':''}>Satellit</option></select></div><div class="set"><span>Darstellung</span><select id="theme">${[['auto','Automatisch'],['light','Hell'],['dark','Dunkel']].map(([v,l])=>`<option value="${v}" ${CFG.theme===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <div class="sub" style="margin:16px 0 4px;font-size:13px">${isAM()?'Im AM-Modus plant Navi 45 Routen für höchstens 45 km/h – ohne Autobahn und Kraftfahrstraße. Rot markierte Straßen sind für Sie verboten. ':''}Karten, Adressen, Läden und Tempolimits kommen aus OpenStreetMap: meist sehr genau, aber nicht fehlerfrei. Wo kein Tempolimit eingetragen ist, zeigt die App kein Schild. Verkehrsschilder gehen immer vor.</div>`,'full');
  const save=()=>LS.set('cfg',CFG);
  $('x').onclick=()=>home();
  $('vSel').onchange=e=>{CFG.voice=e.target.value;save();say('Jetzt bitte rechts abbiegen.',true)};
  $('rate').oninput=e=>{CFG.rate=+e.target.value;save()};
  $('vTest').onclick=()=>{unlockSpeech();say('In 300 Metern links auf die Hauptstraße abbiegen.',true)};
  $('quiet').onchange=e=>{CFG.quiet=e.target.checked;save()};
  $('unp').onchange=e=>{CFG.noUnpaved=e.target.checked;save()};
  $('veh').onchange=e=>{CFG.vehicle=e.target.value;save();document.body.classList.toggle('car',!isAM());clearRoute();showSign(0);forbiddenLayer();settings()};
  if($('fbShow'))$('fbShow').onchange=e=>{CFG.showForbidden=e.target.checked;save();forbiddenLayer()};
  if($('fbWarn'))$('fbWarn').onchange=e=>{CFG.warnForbidden=e.target.checked;save();forbiddenLayer()};
  $('theme').onchange=e=>{CFG.theme=e.target.value;save();setTheme()};
  $('mtype').onchange=e=>{CFG.mapType=e.target.value;save();setTheme();$('btnType').style.color=CFG.mapType==='sat'?'#ff9f0a':''};
}
$('btnSet').onclick=settings;

// ---------- Navigation ----------
async function keepAwake(){try{if(S.navi&&!document.hidden)S.wake=await navigator.wakeLock?.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',keepAwake);
function startNavi(sim){
  if(!route())return;unlockSpeech();
  document.body.classList.add('navi');document.body.classList.remove('free');
  S.navi=true;S.lastIdx=0;S.off=0;S.said={};S.isSim=sim;S.camFree=false;S.camB=null;S.fbHits=0;keepAwake();drawFavs();showSign(0);loadAttrs(route());
  setGeo('alt',null);
  const first=route().man[0];
  say((sim?'Probefahrt. ':'')+(first?.verbal_pre_transition_instruction||first?.instruction||'Los geht’s.'));
  S.said[0]={far:1,mid:1,now:1};
  if(sim){let d=0;const v=isAM()?45:50;const step=()=>{d+=v/3.6*2.5;const r=route(),p=pointAt(d);if(!p||!S.navi){if(S.navi)stopNavi();return}S.kmh=v;onPos(p[0],p[1])};step();S.sim=setInterval(step,1000)}
  else{startWatch();if(S.me)onPos(S.me.lat,S.me.lon)}
}
function stopNavi(){
  S.navi=false;S.isSim=false;document.body.classList.remove('navi','free');clearInterval(S.sim);S.sim=null;drawFavs();showSign(0);
  try{S.wake?.release()}catch(e){}try{speechSynthesis.cancel()}catch(e){}
  if(S.me&&mMe)drawMe(S.me.lat,S.me.lon);
  if(route()&&S.dest){map.easeTo({pitch:0,bearing:0,duration:500});drawRoutes(true);preview()}else home();
}
$('btnStop').onclick=stopNavi;
$('recenter').onclick=()=>{document.body.classList.remove('free');S.camFree=false;S.camB=null};
map.on('dragstart',e=>{if(S.navi&&e.originalEvent)S.camFree=true});
function pointAt(d){const {coords:c,cum}=route();if(d>=cum[cum.length-1])return null;let i=1;while(cum[i]<d)i++;const f=(d-cum[i-1])/((cum[i]-cum[i-1])||1);return[c[i-1][0]+(c[i][0]-c[i-1][0])*f,c[i-1][1]+(c[i][1]-c[i-1][1])*f]}
function project(p){
  const {coords:c,cum}=route(),k=Math.cos(rad(p[0]))*111320,kl=110540;let best={off:1e12,idx:0,along:0,pt:p};
  const scan=(a,b)=>{for(let i=a;i<b;i++){const ax=c[i][1]*k,ay=c[i][0]*kl,dx=c[i+1][1]*k-ax,dy=c[i+1][0]*kl-ay,px=p[1]*k,py=p[0]*kl,L2=dx*dx+dy*dy;
    let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));const o=Math.hypot(px-ax-t*dx,py-ay-t*dy);if(o<best.off)best={off:o,idx:i,along:cum[i]+t*(cum[i+1]-cum[i]),pt:[c[i][0]+t*(c[i+1][0]-c[i][0]),c[i][1]+t*(c[i+1][1]-c[i][1])]}}};
  scan(Math.max(0,S.lastIdx-30),Math.min(c.length-1,S.lastIdx+400));if(best.off>80)scan(0,c.length-1);return best;
}
function alertText(m){return m.verbal_transition_alert_instruction||m.verbal_succinct_transition_instruction||m.instruction}
async function onPos(lat,lon){
  if(!S.navi||!route()){drawMe(lat,lon);return}
  const kmh=S.kmh;$('nSpd').innerHTML=(kmh!=null?Math.round(kmh):'–')+'<small>km/h</small>';
  const pr=project([lat,lon]);
  if(pr.off>40){drawMe(lat,lon);if(!S.camFree)map.easeTo({center:[lon,lat],bearing:S.heading!=null?smoothBearing(S.heading):map.getBearing(),pitch:55,padding:{top:Math.round(innerHeight*.42),bottom:110,left:0,right:0},duration:1000,easing:t=>t});
    if(++S.off>=3&&!S.rerouting&&!S.isSim){S.rerouting=true;$('nText').textContent='Neue Route wird berechnet …';say('Route wird neu berechnet.');
      try{S.from=null;S.routes=(await getRoutes({lat,lon},S.dest,0));S.sel=0;drawRoutes(false);S.lastIdx=0;S.said={}}catch(e){}S.rerouting=false;S.off=0}return}
  S.off=0;S.lastIdx=pr.idx;
  const r=route(),total=r.cum[r.cum.length-1],left=total-pr.along;
  if(!r.edges)loadAttrs(r);const lim=limitAt(r,pr.idx);showSign(lim);
  $('nSpd').classList.toggle('over',kmh!=null&&kmh>(isAM()?Math.min(lim||45,45):(lim||999))+3);
  const ahead=pointAt(Math.min(total-0.5,pr.along+25))||[lat,lon],hd=brg(pr.pt,ahead);
  drawMe(pr.pt[0],pr.pt[1],hd);
  if(!S.camFree)map.easeTo({center:[pr.pt[1],pr.pt[0]],bearing:smoothBearing(hd),pitch:55,zoom:kmh>35?16.6:17.2,padding:{top:Math.round(innerHeight*.42),bottom:110,left:0,right:0},duration:1000,easing:t=>t});
  setGeo('done',r.coords.slice(0,pr.idx+1).concat([pr.pt]));setGeo('route',[pr.pt].concat(r.coords.slice(pr.idx+1)));
  if(left<25){$('nDist').textContent='Angekommen';$('nText').textContent=S.dest.name;$('nIcon').innerHTML=arrow(4);$('nThen').hidden=true;
    const dm=r.man[r.man.length-1];say(dm?.verbal_pre_transition_instruction||'Sie haben Ihr Ziel erreicht.');clearInterval(S.sim);S.navi=false;setTimeout(()=>{S.navi=true;stopNavi()},6000);return}
  let mi=r.man.findIndex((m,i)=>i>0&&r.cum[m.begin_shape_index]>pr.along+3);if(mi<0)mi=r.man.length-1;
  const m=r.man[mi],nx=r.man[mi+1],dNext=r.cum[m.begin_shape_index]-pr.along;
  $('nIcon').innerHTML=arrow(m.type);$('nDist').textContent=fmtDist(dNext);
  const street=(m.street_names||m.begin_street_names||[])[0];
  $('nText').textContent=street&&![4,5,6].includes(m.type)?street:m.instruction;
  if(nx&&m.length<0.2){$('nThen').hidden=false;$('nThen').innerHTML='Danach '+arrow(nx.type,22,'#fff',7)}else $('nThen').hidden=true;
  const rest=left/total*r.sec;$('nEta').textContent=clock(rest);$('nMin').textContent=mins(rest);$('nKm').textContent=comma((left/1000).toFixed(1));
  const sd=S.said[mi]||(S.said[mi]={}),prevLen=mi>0?r.man[mi-1].length*1000:0;
  if(dNext<=1100&&dNext>700&&prevLen>1500&&!sd.far){sd.far=1;say('In '+spokenDist(dNext)+' '+lowFirst(alertText(m)))}
  else if(dNext<=350&&dNext>90&&!sd.mid){sd.mid=sd.far=1;say('In '+spokenDist(dNext)+' '+lowFirst(alertText(m)))}
  else if(dNext<=(kmh>30?45:30)&&!sd.now){sd.now=sd.mid=sd.far=1;say(m.verbal_pre_transition_instruction||m.instruction)}
}

// ---------- Start ----------
sheetTo('peek');home();map.on('load',drawFavs);
window.navi45={S,CFG,forbiddenLayer,map};
if('speechSynthesis' in window)speechSynthesis.getVoices();
try{navigator.permissions?.query({name:'geolocation'}).then(p=>{if(p.state==='granted')startWatch()})}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
